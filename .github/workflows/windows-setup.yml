name: Windows setup

# Sim Deck ships as one Windows NSIS setup .exe.
# Upstream OpenDeck publish workflows (Flathub, AUR, multi-platform drafts) are not used.

on:
  push:
    tags:
      - "v*"
      - "simtuner-*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DENO_DIR: deno_cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ runner.os }}-${{ hashFiles('deno.lock') }}

      - name: Install frontend dependencies
        run: deno install

      - name: Build AKP153 plugin from pinned commit
        shell: pwsh
        run: |
          $pin = (Get-Content -Raw simtuner/akp153/PIN).Trim()
          $src = Join-Path $env:RUNNER_TEMP "akp153"
          git clone --branch cursor/sim-deck-device-name-1e77 --depth 1 https://github.com/alecweinstein/simtuner-deck-akp153.git $src
          $head = (git -C $src rev-parse HEAD).Trim()
          if ($head -ne $pin) { throw "AKP153 checkout $head does not match pin $pin" }
          cargo build --release --manifest-path (Join-Path $src "Cargo.toml")
          $dest = "simtuner/akp153/st.lynx.plugins.opendeck-akp153.sdPlugin"
          New-Item -ItemType Directory -Force -Path (Join-Path $dest "assets") | Out-Null
          Copy-Item (Join-Path $src "manifest.json") $dest
          Copy-Item (Join-Path $src "assets\*") (Join-Path $dest "assets") -Force
          Copy-Item (Join-Path $src "NOTICE") $dest
          Copy-Item (Join-Path $src "CHANGES") $dest
          Copy-Item (Join-Path $src "target\release\opendeck-akp153.exe") (Join-Path $dest "opendeck-akp153-win.exe")
          $manifest = Get-Content (Join-Path $dest "manifest.json") -Raw
          if ($manifest -notmatch '"Name": "Sim Deck"') { throw "AKP153 plugin name is not Sim Deck" }
          if ($manifest -notmatch '"Version": "0.11.2"') { throw "AKP153 plugin version is not 0.11.2" }
          if (-not (Test-Path (Join-Path $dest "opendeck-akp153-win.exe"))) { throw "AKP153 Windows binary missing" }

      - name: Build NSIS installer
        run: deno task tauri build --bundles nsis

      - name: Locate setup exe
        id: exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "NSIS setup exe not found" }
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($exe.Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Built $($exe.FullName)"

      # secrets cannot appear in step `if`. Record only whether they are set.
      - name: Detect signing secrets
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) { "pfx=true" >> $env:GITHUB_OUTPUT } else { "pfx=false" >> $env:GITHUB_OUTPUT }
          if ($env:AZURE_TENANT_ID -and $env:AZURE_CLIENT_ID -and $env:AZURE_SIGNING_ENDPOINT -and $env:AZURE_SIGNING_PROFILE) {
            "azure=true" >> $env:GITHUB_OUTPUT
          } else {
            "azure=false" >> $env:GITHUB_OUTPUT
          }

      - name: Authenticode sign with PFX
        if: steps.signing.outputs.pfx == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $pfx = Join-Path $env:RUNNER_TEMP "simtuner-deck.pfx"
          [IO.File]::WriteAllBytes($pfx, $bytes)
          & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "${{ steps.exe.outputs.path }}"
          Remove-Item -Force $pfx

      - name: Azure Trusted Signing
        if: steps.signing.outputs.azure == 'true'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.exe.outputs.path }}

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: Sim-Deck-setup
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error

      - name: Attach setup exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.exe.outputs.path }}
          name: Sim Deck ${{ github.ref_name }}
          body: |
            Per-user Windows NSIS setup for Sim Deck.
            WebView2 bootstrapper is embedded. No device driver is installed.
            The executable is Authenticode-signed only when repository signing secrets are configured.
            Source: https://github.com/alecweinstein/simtuner-deck
          draft: false
          prerelease: false
